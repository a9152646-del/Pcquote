<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, max-age=0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>神奇海螺電競 | 報價與庫存系統 v16.14 (大字體版)</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        *, ::before, ::after { box-sizing: border-box; }
        body { 
            background-color: #f8fafc; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
            font-size: 14px; 
            color: #1e293b; 
            line-height: 1.5;
            padding-bottom: max(90px, env(safe-area-inset-bottom));
            margin: 0;
        }
        
        .card { 
            background: #ffffff; 
            border-radius: 14px; 
            border: 1px solid #e2e8f0; 
            box-shadow: 0 1px 3px 0 rgba(15, 23, 42, 0.05);
        }
        .hidden { display: none !important; }
        
        /* 🏆 頂部導覽頁籤：大字體、舒適間距、完全不卡動態島 */
        .top-nav-bar {
            position: sticky;
            top: 0;
            z-index: 100;
            background-color: #ffffff;
            padding-top: max(20px, env(safe-area-inset-top));
            padding-bottom: 8px;
            padding-left: 10px;
            padding-right: 10px;
            border-bottom: 2px solid #e2e8f0;
            box-shadow: 0 2px 8px rgba(15, 23, 42, 0.06);
            display: flex;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            gap: 6px;
        }

        /* 導覽頁籤按鈕 (大字好按) */
        .tab-btn { 
            padding: 8px 14px !important;
            font-size: 14px !important; 
            font-weight: 700;
            color: #64748b;
            border-bottom: 3px solid transparent;
            white-space: nowrap;
            border-radius: 8px;
            transition: all 0.2s;
            flex-shrink: 0;
        }
        .tab-btn:hover { color: #1e293b; }
        .tab-active { 
            border-bottom: 3px solid #2563eb !important; 
            color: #2563eb !important; 
            font-weight: 800 !important; 
            background-color: #eff6ff;
        }
        .plan-tab-active { background-color: #2563eb !important; color: #ffffff !important; font-weight: 800 !important; border-color: #2563eb !important; }

        /* 表單與輸入框：恢復 44px 高度與 14px 舒適字體 */
        input[type="text"], input[type="number"], select {
            height: 44px !important;
            line-height: 44px !important;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            padding: 0 12px;
            font-size: 14px !important;
            outline: none;
            background-color: #ffffff;
            color: #1e293b;
            transition: all 0.15s ease-in-out;
            width: 100%;
        }
        textarea {
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            padding: 10px 12px;
            font-size: 14px !important;
            outline: none;
            background-color: #ffffff;
            color: #1e293b;
            width: 100%;
            min-height: 75px;
            resize: vertical;
        }
        input:focus, select:focus, textarea:focus { 
            border-color: #2563eb !important; 
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15); 
        }
        
        /* 標籤顯示控制 */
        .price-tag { color: #64748b; font-weight: 600; font-size: 12px; margin-left: 6px; }
        .cost-tag { color: #e11d48; font-weight: 700; font-size: 12px; margin-left: 6px; }
        
        body.hide-item-prices .price-tag { display: none !important; }
        body.hide-item-costs .cost-tag { display: none !important; }
        body.hide-admin-box #sellerBox { display: none !important; }
        body.ss-hide-totals .ss-total-row { display: none !important; }
        
        /* 狀態色彩 */
        .status-red { background-color: #fff1f2 !important; color: #be123c !important; border: 1px solid #fecdd3 !important; }
        .status-yellow { background-color: #fefce8 !important; color: #a16207 !important; border: 1px solid #fef08a !important; } 
        .status-blue { background-color: #eff6ff !important; color: #1d4ed8 !important; border: 1px solid #bfdbfe !important; }
        .status-orange { background-color: #fff7ed !important; color: #c2410c !important; border: 1px solid #ffedd5 !important; }
        .status-purple { background-color: #faf5ff !important; color: #7e22ce !important; border: 1px solid #e9d5ff !important; }
        .status-green { background-color: #ecfdf5 !important; color: #047857 !important; border: 1px solid #a7f3d0 !important; }

        .pay-unpaid { background-color: #fff1f2 !important; color: #be123c !important; border: 1px solid #fecdd3 !important; }
        .pay-deposit { background-color: #fff7ed !important; color: #c2410c !important; border: 1px solid #ffedd5 !important; }
        .pay-paid { background-color: #ecfdf5 !important; color: #047857 !important; border: 1px solid #a7f3d0 !important; }

        .drag-handle { cursor: grab; color: #94a3b8; padding: 4px; font-size: 18px; user-select: none; display: flex; align-items: center; justify-content: center; }
        .drag-handle:active { cursor: grabbing; color: #2563eb; }

        /* 報價單項目列 */
        .item-row { padding: 12px 14px !important; margin-bottom: 8px !important; background: #ffffff; border: 1px solid #e2e8f0 !important; border-radius: 12px !important; transition: border-color 0.15s; }
        .item-row:hover { border-color: #94a3b8 !important; }
        
        .screenshot-mode .item-row { padding: 8px 12px !important; margin-bottom: 0px !important; border-radius: 0px !important; border: none !important; border-bottom: 1px solid #f1f5f9 !important; box-shadow: none !important; width: 100% !important; }
        .screenshot-mode #configRows { display: block !important; }
        .screenshot-mode .selected-badge { font-size: 12px !important; line-height: 1.3 !important; margin-bottom: 3px !important; }
        .screenshot-mode #screenshot-header { margin-bottom: 10px !important; padding-bottom: 6px !important; }
        .screenshot-mode #screenshot-footer { padding: 8px 12px !important; display: block !important; }
        .screenshot-mode .top-nav-bar { display: none !important; }

        /* 庫存零件項目 */
        .inv-item-row { background: #ffffff; border-radius: 12px; border: 1px solid #e2e8f0; margin-bottom: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
        .inv-item-main { display: flex; align-items: center; gap: 8px; }
        .inv-name-area { flex: 1; min-width: 0; }
        .inv-name-input { width: 100%; border: none !important; background: transparent !important; font-weight: 700; font-size: 14px; padding: 0 !important; color: #0f172a; word-break: break-all; resize: none; min-height: 24px; overflow: hidden; display: block; line-height: 1.4; }
        .inv-control-bar { display: flex; align-items: center; justify-content: space-between; padding-top: 6px; border-top: 1px solid #f1f5f9; }
        .price-group { display: flex; gap: 6px; align-items: center; }
        .val-box { display: flex; align-items: center; gap: 4px; background: #f8fafc; padding: 4px 8px; border-radius: 8px; border: 1px solid #cbd5e1; flex-shrink: 0; }
        .val-label { font-size: 11px; font-weight: 800; color: #64748b; }
        .val-input { border: none !important; background: transparent !important; width: 52px; font-weight: 800; font-size: 13px; text-align: right; padding: 0 !important; height: 26px !important; line-height: 26px !important; }
        .p-input { color: #2563eb; } 
        .c-input { color: #e11d48 !important; font-weight: 800 !important; } 

        .sup-btn { font-size: 11px; width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; border-radius: 6px; border: 1px solid #cbd5e1; color: #64748b; font-weight: 800; transition: all 0.15s; background: white; flex-shrink: 0; }
        .sup-btn.active { background: #2563eb; color: white; border-color: #2563eb; }
        .stock-btn { font-size: 12px; padding: 4px 10px; border-radius: 8px; font-weight: 800; border: 1px solid #cbd5e1; cursor: pointer; min-width: 50px; flex-shrink: 0; }
        .stock-btn.active { background: #10b981; color: white; border-color: #10b981; }
        .stock-btn.oos { background: #f43f5e; color: white; border-color: #f43f5e; }

        .no-screenshot { display: block; }
        .screenshot-mode .no-screenshot { display: none !important; }
        
        #screenshotNav { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 50000; display: flex; flex-direction: column; gap: 10px; width: 260px; }
        
        #adminToggleContainer { position: fixed; bottom: 20px; left: 12px; z-index: 1000; display: flex; flex-direction: column; gap: 6px; }
        .floating-label { background: #ffffff; padding: 6px 12px; border-radius: 50px; box-shadow: 0 2px 10px rgba(15,23,42,0.12); border: 1px solid #cbd5e1; display: flex; align-items: center; gap: 6px; cursor: pointer; }
        
        .stats-card { background: white; padding: 16px; border-radius: 16px; border: 1px solid #e2e8f0; }

        .preview-table { width: 100%; border-collapse: collapse; font-size: 12px; text-align: left; }
        .preview-table th { background-color: #1e293b; color: white; padding: 8px 10px; font-weight: 700; white-space: nowrap; border: 1px solid #334155; }
        .preview-table td { padding: 8px 10px; border: 1px solid #e2e8f0; white-space: nowrap; max-width: 250px; overflow: hidden; text-overflow: ellipsis; }
        .preview-table tr:nth-child(even) { background-color: #f8fafc; }
    </style>
</head>
<body id="mainBody">

    <!-- 頂部導覽頁籤 (防擋大字版) -->
    <div class="top-nav-bar no-screenshot">
        <button onclick="showTab('calc')" id="btn-calc" class="tab-btn tab-active">🖥️ 報價</button>
        <button onclick="showTab('drafts')" id="btn-drafts" class="tab-btn">📂 草稿</button>
        <button onclick="showTab('orders')" id="btn-orders" class="tab-btn">✅ 正式</button>
        <button onclick="showTab('completed')" id="btn-completed" class="tab-btn">🏁 結案</button>
        <button onclick="showTab('trash')" id="btn-trash" class="tab-btn">🗑️ 回收桶</button>
        <button onclick="showTab('stats')" id="btn-stats" class="tab-btn">📊 統計</button>
        <button onclick="showTab('inventory')" id="btn-inventory" class="tab-btn">⚙️ 品項</button>
    </div>

    <!-- 右下角懸浮按鈕 -->
    <div class="no-screenshot fixed right-4 bottom-6 z-[2000] flex flex-col gap-2.5">
        <button id="floatingSaveBtn" onclick="saveInventory()" class="hidden bg-emerald-600 text-white shadow-lg w-11 h-11 rounded-full flex items-center justify-center text-lg cursor-pointer hover:bg-emerald-700 transition-all">💾</button>
        <button onclick="if(confirm('重新整理系統？')) { window.location.reload(true); }" class="bg-slate-700 text-white shadow-lg w-11 h-11 rounded-full flex items-center justify-center text-lg cursor-pointer hover:bg-slate-800 transition-all">🔄</button>
        <button onclick="goBack()" class="bg-slate-900 text-white shadow-lg w-11 h-11 rounded-full flex items-center justify-center text-lg cursor-pointer hover:bg-black transition-all">🔙</button>
    </div>

    <!-- 左下角切換開關 -->
    <div id="adminToggleContainer" class="no-screenshot">
        <label class="floating-label"><span class="text-xs font-bold text-blue-600">💰 售價</span><input type="checkbox" id="itemPriceToggle" checked onchange="toggleItemPriceMode()" class="w-4 h-4 cursor-pointer"></label>
        <label class="floating-label"><span class="text-xs font-bold text-rose-600">🔴 成本</span><input type="checkbox" id="itemCostToggle" checked onchange="toggleItemCostMode()" class="w-4 h-4 cursor-pointer"></label>
        <label class="floating-label"><span class="text-xs font-bold text-slate-700">📊 利潤</span><input type="checkbox" id="adminToggle" checked onchange="toggleAdminMode()" class="w-4 h-4 cursor-pointer"></label>
        <label class="floating-label"><span class="text-xs font-bold text-indigo-600">💵 截圖</span><input type="checkbox" id="ssTotalToggle" checked onchange="toggleSSTotalMode()" class="w-4 h-4 cursor-pointer"></label>
    </div>

    <div id="screenshotNav" class="hidden">
        <button id="ssDownloadBtn" onclick="downloadScreenshot(event)" class="bg-blue-600 text-white py-3 rounded-xl font-bold shadow-lg w-full text-sm cursor-pointer hover:bg-blue-700">💾 存成圖片保存</button>
        <button onclick="exitScreenshotMode()" class="bg-slate-800 text-white py-3 rounded-xl font-bold shadow-lg w-full text-sm cursor-pointer hover:bg-slate-900">🔙 返回報價單</button>
    </div>

    <div class="max-w-7xl mx-auto w-full p-3 md:p-5" id="captureArea">
        <div id="screenshot-header" style="display: none;" class="text-center border-b-2 border-slate-800 pb-2 mb-3">
            <div class="text-xl font-black text-slate-900 tracking-widest">《報價單》</div>
            <div id="ss-plan-name" class="text-sm font-bold text-blue-600 mt-1"></div>
            <div id="ss-time" class="text-xs text-slate-400 mt-0.5 font-mono"></div>
        </div>
        
        <!-- 報價單分頁 -->
        <div id="tab-calc" class="page-content">
            <div class="no-screenshot bg-slate-900 text-white p-3 rounded-2xl mb-3 flex flex-wrap items-center justify-between gap-2 shadow-xs border border-slate-800">
                <div class="flex items-center gap-2 overflow-x-auto">
                    <span class="text-sm font-bold text-slate-300 whitespace-nowrap">📑 方案：</span>
                    <button onclick="switchPlan('A')" id="plan-btn-A" class="px-3.5 py-1.5 rounded-xl text-sm font-bold bg-slate-800 text-slate-300 border border-slate-700 transition-all plan-tab-active cursor-pointer">方案 A</button>
                    <button onclick="switchPlan('B')" id="plan-btn-B" class="px-3.5 py-1.5 rounded-xl text-sm font-bold bg-slate-800 text-slate-300 border border-slate-700 transition-all cursor-pointer">方案 B</button>
                </div>
                <div class="flex items-center gap-2">
                    <button onclick="copyCurrentPlanToOther()" class="bg-amber-600 hover:bg-amber-700 text-white px-3 py-1.5 rounded-xl text-xs font-bold transition-all cursor-pointer">
                        ➕ 複製方案
                    </button>
                    <button onclick="copyDualPlanQuoteText()" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 rounded-xl text-xs font-bold transition-all cursor-pointer">
                        📋 複製雙方案對比
                    </button>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-4 gap-3.5">
                <div class="lg:col-span-3 space-y-3.5">
                    <div class="flex gap-2.5 no-screenshot">
                        <button onclick="openTemplateModal()" class="flex-[2] bg-slate-800 hover:bg-slate-900 text-white h-[44px] rounded-xl font-bold text-sm shadow-xs cursor-pointer transition-all flex items-center justify-center">📂 載入範本</button>
                        <button onclick="copyQuoteAsText()" class="flex-[3] bg-blue-600 hover:bg-blue-700 text-white h-[44px] rounded-xl font-bold text-sm shadow-xs cursor-pointer transition-all flex items-center justify-center">📋 複製當前方案 LINE 報價</button>
                    </div>
                    
                    <div class="card p-3 !bg-slate-50/50">
                        <div id="configRows" class="space-y-2"></div>
                        <div id="screenshot-footer" class="text-right p-3 pt-2 border-t border-slate-200 space-y-1" style="display: none;">
                            <div id="ss-warranty-info" class="text-xs text-blue-600 font-bold mb-0.5"></div>
                            <div class="ss-total-row text-xs text-slate-500 font-bold">折扣：<span id="ss-val-disc" class="text-rose-600"></span></div>
                            <div class="ss-total-row text-lg font-black text-blue-600">總計：<span id="ss-val-total"></span></div>
                        </div>
                    </div>
                    
                    <div class="card p-4 no-screenshot bg-white">
                        <div class="grid grid-cols-1 md:grid-cols-4 gap-3 items-center">
                            <div><input type="text" id="custName" placeholder="👤 客戶姓名" class="font-bold"></div>
                            <div><input type="text" id="custPhone" placeholder="📞 電話"></div>
                            <div><select id="custSource"><option value="FB">FB</option><option value="IG">IG</option><option value="Line">Line</option><option value="蝦皮">蝦皮</option></select></div>
                            
                            <div class="flex gap-2 h-[44px] items-center">
                                <select id="infoSeller" class="flex-1 font-bold text-blue-600 cursor-pointer h-full">
                                    <option value="朱冠穎">朱冠穎</option><option value="江苙翔">江苙翔</option><option value="江鈞宇">江鈞宇</option>
                                </select>
                                <button onclick="addCustomSeller()" class="h-full px-3 bg-slate-100 hover:bg-slate-200 rounded-xl border border-slate-300 font-bold text-slate-700 cursor-pointer flex items-center justify-center flex-shrink-0 text-base">+</button>
                            </div>

                            <div class="md:col-span-4 bg-slate-50 p-3 rounded-xl border border-slate-200 flex flex-col md:flex-row items-center justify-between gap-2">
                                <label class="text-sm font-bold text-slate-700 flex items-center gap-1">🧾 發票開立狀態：</label>
                                <select id="custInvoice" onchange="calculate()" class="w-full md:w-auto font-bold text-slate-800 bg-white border border-slate-300 rounded-xl text-sm outline-none cursor-pointer">
                                    <option value="yes">🧾 開立發票 (自動扣 5% 營業稅)</option>
                                    <option value="no">🚫 免開發票 / 免稅 (不扣稅，100% 計算實賺毛利)</option>
                                </select>
                            </div>

                            <div class="md:col-span-4"><input type="text" id="custAddr" placeholder="📦 地址 / 取貨方式"></div>
                            <div class="md:col-span-4"><input type="text" id="custWarranty" placeholder="🛡️ 保固備註" class="font-bold text-blue-600"></div>
                            <div class="md:col-span-4"><textarea id="orderMemo" placeholder="📝 內部備註"></textarea></div>

                            <div class="md:col-span-4 bg-amber-50/60 p-3 rounded-xl border border-amber-200/80 grid grid-cols-1 md:grid-cols-2 gap-3 items-center">
                                <div class="flex items-center gap-2">
                                    <label class="text-sm font-bold text-amber-800 whitespace-nowrap">💵 預收訂金：</label>
                                    <input type="number" id="depositAmt" placeholder="0" class="w-full font-bold text-amber-700 border-amber-300 bg-white" value="0" oninput="calculate()">
                                </div>
                                <div class="flex items-center justify-between md:justify-end gap-2">
                                    <span class="text-sm font-bold text-rose-600">🔴 待收尾款：</span>
                                    <span id="ui-balanceAmt" class="text-lg font-black text-rose-600">$0</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="lg:col-span-1 no-screenshot">
                    <div class="card p-3.5 sticky top-24 border-t-4 border-blue-600 space-y-3.5">
                        <div class="space-y-2">
                            <div><label class="text-xs text-slate-400 font-bold tracking-wider">折扣</label><input type="number" id="discountAmt" class="w-full mt-1 text-rose-600 font-bold text-base" value="0" oninput="calculate()"></div>
                            <div><label class="text-xs text-blue-500 font-bold tracking-wider">手動總額 (Lock)</label><input type="number" id="manualTotal" class="w-full mt-1 border-blue-200 font-bold text-base text-blue-600" placeholder="修改總價..." oninput="calculate()"></div>
                            <div class="pt-1"><div class="text-xs text-blue-500 font-bold tracking-wider">Total 總計 ✏️</div><div id="ui-totalSale" class="text-2xl font-black text-blue-600">$0</div></div>
                            <div id="ui-noCardShow" class="p-2.5 bg-amber-50 rounded-xl hidden border border-amber-200"><div id="ui-noCardVal" class="text-base font-bold text-amber-700">$0</div></div>
                            <input type="number" id="noCardTotal" class="w-full border-amber-200 text-sm" placeholder="輸入無卡金額" oninput="calculate()">
                        </div>

                        <div id="sellerBox" class="bg-slate-50 p-3 rounded-xl border border-slate-200 space-y-2 text-xs">
                            <div class="flex justify-between text-slate-500 font-bold"><span>零件總成本</span><span id="ui-totalCost">$0</span></div>
                            <div class="flex justify-between text-slate-700 font-bold"><span>總金額</span><span id="ui-taxedTotal">$0</span></div>
                            <div class="flex justify-between text-slate-600 font-bold"><span id="ui-preTaxLabel">未稅金額 (5%)</span><span id="ui-preTaxTotal">$0</span></div>
                            <div class="flex justify-between text-rose-500 font-bold"><span>營業稅金 (5%)</span><span id="ui-taxAmt">-$0</span></div>
                            <div class="border-t border-slate-200 pt-1.5 space-y-1">
                                <div class="flex justify-between font-bold text-slate-700"><span>含稅毛利</span><span id="ui-taxedProfit">$0</span></div>
                                <div class="flex justify-between font-black text-emerald-600 text-sm"><span>稅後實賺毛利</span><span id="ui-preTaxProfit">$0</span></div>
                            </div>
                        </div>

                        <div class="space-y-2">
                            <button onclick="saveRecord('current')" class="w-full bg-blue-600 hover:bg-blue-700 text-white h-[44px] rounded-xl font-bold shadow-xs cursor-pointer transition-all flex items-center justify-center text-sm">💾 儲存修訂 (A+B方案)</button>
                            <button onclick="saveTemplate()" class="w-full bg-slate-700 hover:bg-slate-800 text-white h-[44px] rounded-xl font-bold cursor-pointer transition-all flex items-center justify-center text-sm">📂 存為範本</button>
                            <button onclick="enterScreenshotMode()" class="w-full bg-amber-600 hover:bg-amber-700 text-white h-[44px] rounded-xl font-bold cursor-pointer transition-all flex items-center justify-center text-sm">📸 截圖模式</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    <script>
    const firebaseConfig = { apiKey: "AIzaSyDeCI3yFPr1v9KxOmko-qim2a7EtllEHKM", authDomain: "magic-conch-gaming.firebaseapp.com", databaseURL: "https://magic-conch-gaming-default-rtdb.asia-southeast1.firebasedatabase.app", projectId: "magic-conch-gaming", storageBucket: "magic-conch-gaming.firebasestorage.app", messagingSenderId: "105735978925", appId: "1:105735978925:web:3ec77acbfd344475322b24" };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let inv = {}; let catOrder = []; let records = []; let templates = {}; let editingRecordId = null; let currentCat = "";
    let collapsedCats = {}; 
    let generatedImgUrl = "";
    let currentTsvText = "";
    let currentHtmlTable = "";

    let currentPlan = 'A';
    let plansData = {
        'A': { selections: {}, discount: 0, manualTotal: '', noCard: '', deposit: 0 },
        'B': { selections: {}, discount: 0, manualTotal: '', noCard: '', deposit: 0 }
    };
    let currentSelections = {};

    function getMonthKey(timeStr) {
        if (!timeStr) return '其他';
        const match = String(timeStr).match(/(\d{4})[\/\-](\d{1,2})/);
        if (match) {
            const year = match[1];
            const month = match[2].padStart(2, '0');
            return `${year}/${month}`;
        }
        return '其他';
    }

    function saveCurrentInputsToPlan() {
        plansData[currentPlan] = {
            selections: JSON.parse(JSON.stringify(currentSelections)),
            discount: document.getElementById('discountAmt')?.value || 0,
            manualTotal: document.getElementById('manualTotal')?.value || '',
            noCard: document.getElementById('noCardTotal')?.value || '',
            deposit: document.getElementById('depositAmt')?.value || 0
        };
    }

    function switchPlan(planKey) {
        saveCurrentInputsToPlan();
        currentPlan = planKey;
        
        document.getElementById('plan-btn-A').classList.remove('plan-tab-active');
        document.getElementById('plan-btn-B').classList.remove('plan-tab-active');
        document.getElementById(`plan-btn-${planKey}`).classList.add('plan-tab-active');

        const p = plansData[planKey];
        currentSelections = JSON.parse(JSON.stringify(p.selections || {}));
        document.getElementById('discountAmt').value = p.discount || 0;
        document.getElementById('manualTotal').value = p.manualTotal || '';
        document.getElementById('noCardTotal').value = p.noCard || '';
        document.getElementById('depositAmt').value = p.deposit || 0;

        renderConfig();
    }

    function copyCurrentPlanToOther() {
        saveCurrentInputsToPlan();
        const targetPlan = (currentPlan === 'A') ? 'B' : 'A';
        plansData[targetPlan] = JSON.parse(JSON.stringify(plansData[currentPlan]));
        alert(`📋 已將【方案 ${currentPlan}】複製到【方案 ${targetPlan}】！`);
    }

    function downloadScreenshot(e) {
        const captureEl = document.getElementById('captureArea');
        if(!captureEl) return;
        const btn = document.getElementById('ssDownloadBtn');
        const origText = btn ? btn.innerText : '💾 存成圖片保存';
        if (btn) btn.innerText = '⏳ 生成中...';
        window.scrollTo(0, 0);

        setTimeout(() => {
            try {
                html2canvas(captureEl, { useCORS: true, allowTaint: true, scale: 2, backgroundColor: "#f8fafc", logging: false }).then(canvas => {
                    if (btn) btn.innerText = origText;
                    const dataUrl = canvas.toDataURL('image/png');
                    generatedImgUrl = dataUrl;
                    const imgEl = document.getElementById('previewImg');
                    if (imgEl) imgEl.src = dataUrl;
                    const modal = document.getElementById('imgPreviewModal');
                    if (modal) modal.classList.remove('hidden');
                }).catch(err => {
                    if (btn) btn.innerText = origText;
                    alert('截圖失敗：' + (err.message || '請重試'));
                });
            } catch(err) {
                if (btn) btn.innerText = origText;
                alert('截圖發生錯誤！');
            }
        }, 300);
    }

    function openImageInNewTab() {
        if (!generatedImgUrl) return;
        const newWin = window.open();
        if (newWin) newWin.document.write(`<title>報價單圖片</title><body style="margin:0;background:#333;display:flex;justify-content:center;align-items:center;min-height:100vh;"><img src="${generatedImgUrl}" style="max-width:100%;height:auto;"/></body>`);
    }

    function calculate() {
        try {
            let subP = 0, subC = 0, disc = parseFloat(document.getElementById('discountAmt')?.value || 0);
            let noCard = parseFloat(document.getElementById('noCardTotal')?.value || 0);
            let manualVal = document.getElementById('manualTotal').value;
            const hasInvoice = document.getElementById('custInvoice')?.value !== 'no';

            catOrder.forEach(cat => {
                (currentSelections[cat] || []).forEach(s => {
                    let p = 0, c = 0; 
                    if (s.p !== undefined && s.c !== undefined) { p = Number(s.p || 0); c = Number(s.c || 0); } 
                    else { const item = (inv[cat] || [])[s.idx]; if(item) { p = Number(item.p || 0); c = Number(item.c || 0); } }
                    if(!s.isGift) subP += (p * (s.qty || 1)); subC += (c * (s.qty || 1));
                });
            });
            const baseTaxedTotal = (manualVal !== "" && !isNaN(parseFloat(manualVal))) ? parseFloat(manualVal) : (subP - disc);
            document.getElementById('ui-totalSale').innerText = `$${baseTaxedTotal.toLocaleString()}`;
            
            let finalTaxedTotal = baseTaxedTotal;
            if (noCard > 0) { 
                finalTaxedTotal = noCard; 
                document.getElementById('ui-noCardVal').innerText = `$${noCard.toLocaleString()}`; 
                document.getElementById('ui-noCardShow').classList.remove('hidden'); 
            } else {
                document.getElementById('ui-noCardShow').classList.add('hidden');
            }
            
            let preTaxTotal = finalTaxedTotal;
            let taxAmt = 0;
            let preTaxProfit = finalTaxedTotal - subC;
            let taxedProfit = finalTaxedTotal - subC;

            if (hasInvoice) {
                preTaxTotal = Math.round(finalTaxedTotal / 1.05); 
                taxAmt = Math.round(finalTaxedTotal - preTaxTotal); 
                preTaxProfit = preTaxTotal - subC; 
                document.getElementById('ui-preTaxLabel').innerText = "未稅金額 (5%)";
            } else {
                document.getElementById('ui-preTaxLabel').innerText = "銷售額 (免開立)";
            }
            
            const depositAmt = parseFloat(document.getElementById('depositAmt')?.value || 0);
            const balanceAmt = finalTaxedTotal - depositAmt;
            if (document.getElementById('ui-balanceAmt')) {
                document.getElementById('ui-balanceAmt').innerText = `$${balanceAmt.toLocaleString()}`;
            }

            document.getElementById('ui-totalCost').innerText = `$${subC.toLocaleString()}`; 
            document.getElementById('ui-taxedTotal').innerText = `$${finalTaxedTotal.toLocaleString()}`; 
            document.getElementById('ui-preTaxTotal').innerText = `$${preTaxTotal.toLocaleString()}`; 
            document.getElementById('ui-taxAmt').innerText = `-$${taxAmt.toLocaleString()}`; 
            document.getElementById('ui-taxedProfit').innerText = `$${taxedProfit.toLocaleString()}`; 
            document.getElementById('ui-preTaxProfit').innerText = `$${preTaxProfit.toLocaleString()}`; 
        } catch(e) {}
    }

    function renderConfig() {
        const container = document.getElementById('configRows'); if(!container) return;
        const isSS = document.getElementById('mainBody').classList.contains('screenshot-mode'); 
        container.innerHTML = '';
        catOrder.forEach(cat => {
            const items = currentSelections[cat] || []; if (isSS && items.length === 0) return;
            const badges = items.map((sel, sIdx) => {
                let target = (inv[cat] || [])[sel.idx]; if(!target) return '';
                const dispP = (sel.p !== undefined) ? sel.p : target.p;
                const dispC = (sel.c !== undefined) ? sel.c : (target.c || 0);
                return `<div class="selected-badge flex-col mb-1">${sel.isGift?'[贈] ':''}<div>${target.name}${sel.qty>1?`<span class="bg-blue-50 text-blue-600 px-1.5 py-0.5 rounded-full ml-1 text-xs font-bold">x${sel.qty}</span>`:''} <span class="price-tag">($${Number(dispP).toLocaleString()})</span><span class="cost-tag">(本:$${Number(dispC).toLocaleString()})</span></div></div>`;
            }).join('');
            container.innerHTML += `<div class="item-row cursor-pointer" onclick="openSelection('${cat}')"><div class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">${cat}</div><div class="flex flex-col">${badges || '<span class="text-slate-300 italic text-xs">未選中項目...</span>'}</div></div>`;
        });
        calculate();
    }

    function initDragAndDrop() {
        const main = document.getElementById('inventoryEditor');
        if(main) {
            if (main.sortableInstance) main.sortableInstance.destroy();
            main.sortableInstance = new Sortable(main, { handle: '.cat-drag-handle', animation: 250, delay: 150, delayOnTouchOnly: true, forceFallback: true, onEnd: function() { catOrder = Array.from(main.querySelectorAll('.category-drag-item')).map(el => el.dataset.catname); }});
        }
        document.querySelectorAll('.item-drag-container').forEach(c => {
            if (c.sortableInstance) c.sortableInstance.destroy();
            const cat = c.dataset.cat;
            c.sortableInstance = new Sortable(c, { handle: '.item-drag-handle', animation: 250, delay: 150, delayOnTouchOnly: true, forceFallback: true, onEnd: function() { const rows = Array.from(c.querySelectorAll('.item-drag-row')); const old = [...(inv[cat] || [])]; inv[cat] = rows.map(r => old[parseInt(r.dataset.originalidx)]); renderInventoryEditor(); }});
        });
    }

    function renderInventoryEditor() { 
        const area = document.getElementById('inventoryEditor'); if (!area) return; const scrollPos = window.scrollY; area.innerHTML = ''; 
        const head = document.getElementById('inventoryHeader'); 
        if(head) head.innerHTML = `<div class="flex justify-between items-center"><h2 class="font-bold text-sm text-slate-800">⚙️ 雲端品項管理</h2><div class="flex gap-2"><button onclick="addNewCategory()" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 rounded-xl text-xs font-bold cursor-pointer">+ 大項</button><button onclick="saveInventory()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded-xl text-xs font-bold cursor-pointer">💾 同步</button></div></div><div class="flex gap-2"><button onclick="toggleAllCats(true)" class="flex-1 bg-slate-100 text-slate-600 py-1.5 rounded-xl text-xs font-bold cursor-pointer">收合 ↑</button><button onclick="toggleAllCats(false)" class="flex-1 bg-slate-100 text-slate-600 py-1.5 rounded-xl text-xs font-bold cursor-pointer">展開 ↓</button></div>`; 
        catOrder.forEach((cat, cIdx) => { 
            const isCollapsed = collapsedCats[cat]; const sec = document.createElement('div'); sec.className = "bg-slate-50 p-3 rounded-xl border border-slate-200 mb-2.5 category-drag-item"; sec.dataset.catname = cat; 
            sec.innerHTML = `<div class="flex justify-between items-center ${isCollapsed?'':'mb-2'}"><div class="flex items-center gap-2"><span class="drag-handle cat-drag-handle">≡</span><input class="font-bold text-sm text-slate-800 border-none bg-transparent p-0 w-36" value="${cat}" onchange="renameCat(${cIdx}, this.value)"></div><div class="flex items-center gap-1.5"><button onclick="collapsedCats['${cat}']=!collapsedCats['${cat}'];renderInventoryEditor();" class="px-2.5 py-1 bg-white border border-slate-200 rounded-lg font-bold text-xs text-slate-600 shadow-xs cursor-pointer">${isCollapsed?'展開 +':'收合 -'}</button><button onclick="removeCat(${cIdx})" class="text-slate-300 hover:text-rose-500 text-lg cursor-pointer">×</button></div></div><div id="edit-${cat}" class="space-y-2 item-drag-container ${isCollapsed?'hidden':''}" data-cat="${cat}"></div><button onclick="addInvItem('${cat}')" class="w-full text-xs font-bold bg-white mt-2.5 py-2 rounded-xl border border-dashed border-slate-300 text-slate-500 hover:text-slate-700 cursor-pointer ${isCollapsed?'hidden':''}">+ 新增零件</button>`; 
            area.appendChild(sec); 
            if(!isCollapsed) {
                (inv[cat] || []).forEach((item, idx) => { 
                    const row = document.createElement('div'); row.className = `inv-item-row item-drag-row`; row.dataset.originalidx = idx; 
                    const sups = ['原', '速', '裕']; let supHtml = sups.map(s => `<button onclick="toggleSup('${cat}', ${idx}, '${s}')" class="sup-btn ${(item.sups||[]).includes(s)?'active':''}">${s}</button>`).join(''); 
                    row.innerHTML = `<div class="inv-item-main"><span class="drag-handle item-drag-handle">≡</span><div class="inv-name-area"><textarea class="inv-name-input" rows="1">${item.name}</textarea></div><button onclick="removeInvItem('${cat}', ${idx})" class="text-slate-300 hover:text-rose-500 text-lg px-1 flex-shrink-0 cursor-pointer">×</button></div><div class="inv-control-bar"><div class="price-group"><div class="val-box"><span class="val-label">售</span><input type="number" class="val-input p-input" value="${item.p}" onchange="inv['${cat}'][${idx}].p=Number(this.value)"></div><div class="val-box"><span class="val-label">本</span><input type="number" class="val-input c-input" value="${item.c||0}" onchange="inv['${cat}'][${idx}].c=Number(this.value)"></div><div class="flex gap-1.5 mx-1">${supHtml}</div><button onclick="inv['${cat}'][${idx}].outOfStock=!inv['${cat}'][${idx}].outOfStock;renderInventoryEditor();" class="stock-btn ${item.outOfStock?'oos':'active'} cursor-pointer">${item.outOfStock?'缺貨':'供應'}</button></div></div>`; 
                    document.getElementById(`edit-${cat}`).appendChild(row); 
                    const ta = row.querySelector('textarea'); setTimeout(() => { ta.style.height = 'auto'; ta.style.height = (ta.scrollHeight) + 'px'; }, 10);
                    ta.addEventListener('input', function() { this.style.height = 'auto'; this.style.height = (this.scrollHeight) + 'px'; inv[cat][idx].name = this.value; });
                });
            }
        }); 
        setTimeout(() => { initDragAndDrop(); window.scrollTo(0, scrollPos); }, 50);
    }

    function toggleItemPriceMode() { const i = document.getElementById('itemPriceToggle').checked; if(i) document.getElementById('mainBody').classList.remove('hide-item-prices'); else document.getElementById('mainBody').classList.add('hide-item-prices'); }
    function toggleItemCostMode() { const i = document.getElementById('itemCostToggle').checked; if(i) document.getElementById('mainBody').classList.remove('hide-item-costs'); else document.getElementById('mainBody').classList.add('hide-item-costs'); }
    function toggleAdminMode() { const i = document.getElementById('adminToggle').checked; if(i) document.getElementById('mainBody').classList.remove('hide-admin-box'); else document.getElementById('mainBody').classList.add('hide-admin-box'); }
    function toggleSSTotalMode() { const i = document.getElementById('ssTotalToggle').checked; if(i) document.getElementById('mainBody').classList.remove('ss-hide-totals'); else document.getElementById('mainBody').classList.add('ss-hide-totals'); }

    function saveRecord(st) { 
        saveCurrentInputsToPlan();
        const id = editingRecordId ? String(editingRecordId) : String(Date.now()); 
        const oldR = records.find(x => String(x.id) === id);
        const status = st === 'current' ? (oldR ? (oldR.status || 'draft') : 'draft') : st;
        const depositVal = parseFloat(document.getElementById('depositAmt').value || 0);
        
        let defaultPayStatus = (editingRecordId && oldR) ? (oldR.payStatus || "未付款") : "未付款";
        if (depositVal > 0 && defaultPayStatus === "未付款") defaultPayStatus = "已付訂金";

        const currentDisplayTotal = document.getElementById('ui-totalSale').innerText || "$0";

        const rawData = { 
            id: id, 
            time: (oldR ? oldR.time : new Date().toLocaleString()), 
            name: document.getElementById('custName').value || "", 
            custPhone: document.getElementById('custPhone').value || "", 
            custSource: document.getElementById('custSource').value || "FB", 
            custAddr: document.getElementById('custAddr').value || "", 
            custWarranty: document.getElementById('custWarranty').value || "", 
            seller: document.getElementById('infoSeller').value || "朱冠穎", 
            hasInvoice: document.getElementById('custInvoice')?.value || "yes",
            payStatus: defaultPayStatus,
            orderMemo: document.getElementById('orderMemo').value || "", 
            deposit: depositVal, 
            plans: plansData, 
            selections: currentSelections || {}, 
            total: currentDisplayTotal, 
            discount: document.getElementById('discountAmt').value || 0, 
            noCard: document.getElementById('noCardTotal').value || "", 
            manualTotal: document.getElementById('manualTotal').value || "", 
            status: status, 
            progress: (oldR ? oldR.progress : "待處理"), 
            notShipped: (oldR ? (oldR.notShipped || {}) : {}) 
        }; 

        db.ref('records/' + id).update(rawData).then(() => { 
            alert(`💾 成功儲存！`); 
            resetForm(); 
            showTab(status === 'draft' ? 'drafts' : (status === 'order' ? 'orders' : 'completed')); 
        });
    }

    function promptConvertToOrder(id) {
        const r = records.find(x => String(x.id) === String(id));
        if(!r) { alert('找不到草稿'); return; }
        
        const hasValidPlans = r.plans && r.plans.A && r.plans.B && (Object.keys(r.plans.A.selections || {}).length > 0 || Object.keys(r.plans.B.selections || {}).length > 0);

        if (hasValidPlans) {
            const optionsContainer = document.getElementById('planSelectOptions');
            if(!optionsContainer) {
                if(confirm('轉為正式訂單？')) db.ref('records/' + id + '/status').set('order');
                return;
            }
            optionsContainer.innerHTML = '';

            ['A', 'B'].forEach(pKey => {
                const p = r.plans[pKey] || {};
                let subP = 0;
                catOrder.forEach(cat => {
                    ((p.selections || {})[cat] || []).forEach(s => {
                        let target = (inv[cat] || [])[s.idx];
                        if (target && !s.isGift) subP += ((s.p !== undefined ? s.p : target.p) * (s.qty||1));
                    });
                });
                const baseTotal = (p.manualTotal !== "" && !isNaN(parseFloat(p.manualTotal))) ? parseFloat(p.manualTotal) : (subP - (p.discount||0));
                const finalTotal = (p.noCard && p.noCard !== "") ? parseFloat(p.noCard) : baseTotal;

                optionsContainer.innerHTML += `
                    <button onclick="executeConvertToOrder('${id}', '${pKey}')" class="w-full text-left p-3 border rounded-xl border-slate-200 hover:border-blue-600 bg-slate-50/50 flex justify-between items-center cursor-pointer">
                        <div>
                            <div class="font-bold text-sm text-slate-800">【方案 ${pKey}】</div>
                            <div class="text-xs text-slate-500">預估：$${finalTotal.toLocaleString()}</div>
                        </div>
                        <span class="bg-blue-600 text-white font-bold text-xs px-3 py-1.5 rounded-lg">確定</span>
                    </button>
                `;
            });
            document.getElementById('planSelectModal').classList.remove('hidden');
        } else {
            if(confirm('確定要轉為正式訂單嗎？')) {
                db.ref('records/' + id + '/status').set('order');
            }
        }
    }

    function executeConvertToOrder(id, chosenPlanKey) {
        const r = records.find(x => String(x.id) === String(id));
        if(!r) return;

        const chosenPlan = (r.plans && r.plans[chosenPlanKey]) ? r.plans[chosenPlanKey] : { selections: r.selections || {}, discount: r.discount || 0, manualTotal: r.manualTotal || '', noCard: r.noCard || '' };
        
        let subP = 0;
        catOrder.forEach(cat => {
            ((chosenPlan.selections || {})[cat] || []).forEach(s => {
                let target = (inv[cat] || [])[s.idx];
                if (target && !s.isGift) subP += ((s.p !== undefined ? s.p : target.p) * (s.qty||1));
            });
        });
        const baseTotal = (chosenPlan.manualTotal !== "" && !isNaN(parseFloat(chosenPlan.manualTotal))) ? parseFloat(chosenPlan.manualTotal) : (subP - (chosenPlan.discount||0));
        const finalTotalStr = `$${((chosenPlan.noCard && chosenPlan.noCard !== "") ? parseFloat(chosenPlan.noCard) : baseTotal).toLocaleString()}`;

        const updateData = {
            status: 'order',
            selections: chosenPlan.selections || r.selections || {},
            discount: chosenPlan.discount || r.discount || 0,
            manualTotal: chosenPlan.manualTotal || r.manualTotal || '',
            noCard: chosenPlan.noCard || r.noCard || '',
            total: finalTotalStr,
            plans: null 
        };

        db.ref('records/' + id).update(updateData).then(() => {
            const modal = document.getElementById('planSelectModal');
            if(modal) modal.classList.add('hidden');
            alert(`✅ 已選定【方案 ${chosenPlanKey}】轉為正式訂單！`);
        });
    }

    /* 軟刪除與回收桶邏輯 */
    function moveToTrash(id) {
        const r = records.find(x => String(x.id) === String(id));
        if(!r) return;
        if(confirm('要移至「回收桶」嗎？')) {
            db.ref('records/' + id).update({
                prevStatus: r.status || 'draft',
                status: 'trash'
            });
        }
    }

    function restoreFromTrash(id) {
        const r = records.find(x => String(x.id) === String(id));
        if(!r) return;
        const targetStatus = r.prevStatus || 'draft';
        db.ref('records/' + id).update({
            status: targetStatus,
            prevStatus: null
        }).then(() => alert(`↩️ 訂單已還原至【${targetStatus==='draft'?'草稿':(targetStatus==='order'?'正式':'結案')}】！`));
    }

    function purgeTrashRecord(id) {
        if(confirm('🔥 確定【永久刪除】此訂單？（無法復原）')) {
            db.ref('records/' + id).remove();
        }
    }

    function emptyTrash() {
        const trashRecords = records.filter(r => r && r.status === 'trash');
        if(trashRecords.length === 0) { alert('回收桶是空的'); return; }
        if(confirm(`🔥 確定一鍵【清空回收桶】？將刪除 ${trashRecords.length} 筆資料！`)) {
            trashRecords.forEach(r => {
                db.ref('records/' + r.id).remove();
            });
        }
    }

        Object.values(lists).forEach(l => { if(l) l.innerHTML = ''; });

    function renderStats() {
        const content = document.getElementById('statsContent'); 
        if(!content) return; 

        let allMonthsSet = new Set();
        let allSellersSet = new Set(["朱冠穎", "江苙翔", "江鈞宇"]);

        records.forEach(r => {
            if(!r || r.status === 'draft' || r.status === 'trash') return;
            const monthKey = getMonthKey(r.time);
            allMonthsSet.add(monthKey);
            if(r.seller) allSellersSet.add(r.seller);
        });

        let monthsList = Array.from(allMonthsSet).sort((a,b)=>b.localeCompare(a));
        let sellersList = Array.from(allSellersSet);

        const selectedMonth = document.getElementById('filterStatsMonth')?.value || 'ALL';
        const selectedSeller = document.getElementById('filterStatsSeller')?.value || 'ALL';

        let monthlyData = {};
        let sellerStats = {};
        sellersList.forEach(s => { sellerStats[s] = { profit: 0, count: 0 }; });

        let filteredCompletedRecords = [];

        records.forEach(r => { 
            if(!r || r.status === 'draft' || r.status === 'trash') return; 
            const monthKey = getMonthKey(r.time);
            
            if(selectedMonth !== 'ALL' && monthKey !== selectedMonth) return;
            const sName = r.seller || "朱冠穎";
            if(selectedSeller !== 'ALL' && sName !== selectedSeller) return;

            if(!monthlyData[monthKey]) monthlyData[monthKey] = { revenue: 0, cost: 0, taxTotal: 0, profit: 0, count: 0 }; 
            
            const noCardAmt = (r.noCard && r.noCard !== "") ? parseFloat(r.noCard) : 0;
            const rev = parseInt(String(r.total || '0').replace(/[^0-9.-]+/g,"")) || 0; 
            const activeRevForTax = noCardAmt > 0 ? noCardAmt : rev;

            const hasInv = (r.hasInvoice !== 'no');
            const tax = hasInv ? Math.round(activeRevForTax - (activeRevForTax / 1.05)) : 0;
            const preTax = hasInv ? Math.round(activeRevForTax / 1.05) : activeRevForTax;
            
            let itemCost = 0; 
            const selections = r.selections || {};
            for(let cat in selections) { 
                const selList = selections[cat];
                if(Array.isArray(selList)) {
                    selList.forEach(s => { 
                        if(!s) return;
                        let c = (s.c !== undefined) ? Number(s.c) : 0; 
                        if(!s.c && inv && inv[cat]) { const item = inv[cat][s.idx]; if(item) c = Number(item.c || 0); } 
                        itemCost += (c * (s.qty || 1)); 
                    });
                }
            } 

            const orderProfit = preTax - itemCost;
            monthlyData[monthKey].revenue += preTax; 
            monthlyData[monthKey].cost += itemCost; 
            monthlyData[monthKey].taxTotal += tax; 
            monthlyData[monthKey].profit += orderProfit; 
            monthlyData[monthKey].count += 1; 

            if (r.status === 'completed') {
                filteredCompletedRecords.push(r);
                if (!sellerStats[sName]) sellerStats[sName] = { profit: 0, count: 0 };
                sellerStats[sName].profit += orderProfit;
                sellerStats[sName].count += 1;
            }
        }); 
        
        let monthOptionsHtml = `<option value="ALL">📅 全部月份</option>` + monthsList.map(m => `<option value="${m}" ${selectedMonth===m?'selected':''}>📅 ${m}</option>`).join('');
        let sellerOptionsHtml = `<option value="ALL">👤 全部人員</option>` + sellersList.map(s => `<option value="${s}" ${selectedSeller===s?'selected':''}>👤 ${s}</option>`).join('');

        let html = `

            <div class="flex justify-between items-center flex-wrap gap-2 border-b border-slate-100 pb-2">
                <div>
                    <h2 class="font-bold text-slate-800 text-sm">📊 月度結算戰情室</h2>
                    <p class="text-xs text-slate-400">公司 60% ｜ 業務 40% 自動結算</p>
                </div>
                <button onclick="exportCompletedOrdersCSV()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded-xl font-bold text-xs shadow-xs flex items-center justify-center cursor-pointer">
                    📊 匯出 CSV
                </button>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-2.5">
                <div class="flex items-center gap-2">
                    <label class="text-xs font-bold text-slate-600 whitespace-nowrap">月份：</label>
                    <select id="filterStatsMonth" onchange="renderStats()" class="w-full font-bold text-blue-700 bg-slate-50 border border-slate-200 rounded-xl p-1 text-xs outline-none cursor-pointer">
                        ${monthOptionsHtml}
                    </select>
                </div>
                <div class="flex items-center gap-2">
                    <label class="text-xs font-bold text-slate-600 whitespace-nowrap">人員：</label>
                    <select id="filterStatsSeller" onchange="renderStats()" class="w-full font-bold text-slate-800 bg-slate-50 border border-slate-200 rounded-xl p-1 text-xs outline-none cursor-pointer">
                        ${sellerOptionsHtml}
                    </select>
                </div>
            </div>
        </div>`;

        html += `<div class="grid grid-cols-1 md:grid-cols-3 gap-2.5 mb-3">`;
        
        Object.keys(sellerStats).forEach(name => {
            if(selectedSeller !== 'ALL' && name !== selectedSeller) return;
            const sData = sellerStats[name];
            const commission = Math.round(sData.profit * 0.4); 
            const companyShare = Math.round(sData.profit * 0.6); 

            html += `
            <div class="card p-3 space-y-1.5 border-slate-200 bg-white text-xs">
                <div class="flex justify-between items-center border-b border-slate-100 pb-1.5">
                    <span class="font-bold text-slate-800 text-sm">👤 ${name}</span>
                    <span class="text-xs bg-slate-100 text-slate-600 px-2 py-0.5 rounded-lg font-bold">已結案 ${sData.count} 單</span>
                </div>
                <div class="text-xs text-slate-500 flex justify-between">
                    <span>總毛利：</span>
                    <span class="font-bold text-slate-700">$${Math.round(sData.profit).toLocaleString()}</span>
                </div>
                <div class="text-xs text-blue-600 flex justify-between">
                    <span>業務抽成 (40%)：</span>
                    <span class="font-bold text-blue-600">$${commission.toLocaleString()}</span>

    function exportCompletedOrdersCSV() {
        try {
            const selectedMonth = document.getElementById('filterStatsMonth')?.value || 'ALL';
            const selectedSeller = document.getElementById('filterStatsSeller')?.value || 'ALL';

            const completedRecords = records.filter(r => {
                if (!r || r.status !== 'completed') return false;
                const monthKey = getMonthKey(r.time);
                if (selectedMonth !== 'ALL' && monthKey !== selectedMonth) return false;
                const sName = r.seller || "朱冠穎";
                if (selectedSeller !== 'ALL' && sName !== selectedSeller) return false;
                return true;
            });

            if (completedRecords.length === 0) { alert('目前無符合條件的【結案】紀錄！'); return; }

            const baseHeadersFront = ["訂單ID", "日期時間", "客戶姓名", "電話", "客戶來源", "負責業務", "發票狀態"];
            const dynamicCatHeaders = catOrder.map(cat => `【${cat}】`);
            const baseHeadersBack = ["總金額", "折扣金額", "銷售額(未稅/免稅)", "營業稅(5%)", "零件總成本", "稅後實賺毛利", "業務抽成(40%)", "預收訂金", "待收尾款", "付款狀態", "取貨地址", "保固備註", "內部備註"];

            const allHeaders = [...baseHeadersFront, ...dynamicCatHeaders, ...baseHeadersBack];
            let tsvContent = allHeaders.join('\t') + '\n';
            let htmlRows = '';

            completedRecords.forEach(r => {
                const totalVal = parseInt(String(r.total || '0').replace(/[^0-9.-]+/g,"")) || 0;
                const discountVal = Number(r.discount || 0);
                const noCardAmt = (r.noCard && r.noCard !== "") ? parseFloat(r.noCard) : 0;
                const activeRev = noCardAmt > 0 ? noCardAmt : totalVal;

                const hasInv = (r.hasInvoice !== 'no');
                const preTax = hasInv ? Math.round(activeRev / 1.05) : activeRev;
                const tax = hasInv ? Math.round(activeRev - preTax) : 0;

                let itemCost = 0;
                const selections = r.selections || {};

                const catCells = catOrder.map(cat => {
                    const selList = selections[cat];
                    if (Array.isArray(selList) && selList.length > 0) {
                        return selList.map(s => {
                            if (!s) return '';
                            let target = (inv[cat] || [])[s.idx];
                            let itemName = target ? target.name : '未知零件';
                            let itemPrice = (s.p !== undefined) ? Number(s.p) : (target ? Number(target.p||0) : 0);
                            let itemC = (s.c !== undefined) ? Number(s.c) : (target ? Number(target.c||0) : 0);
                            let qty = s.qty || 1;
                            itemCost += (itemC * qty);
                            return `${itemName}${qty > 1 ? ' x' + qty : ''} ($${itemPrice.toLocaleString()})${s.isGift?'[贈]':''}`;
                        }).join(' ; ');
                    }
                    return '-';
                });

                const profit = preTax - itemCost;
                const commission40 = Math.round(profit * 0.4);
                const deposit = Number(r.deposit || 0);
                const balance = activeRev - deposit;
                
                const memo = String(r.orderMemo || '').replace(/\r?\n|\r/g, ' ');
                const name = String(r.name || '無名氏');
                const phone = String(r.custPhone || '');
                const source = String(r.custSource || '');
                const seller = String(r.seller || '');
                const payStatus = String(r.payStatus || '');
                const addr = String(r.custAddr || '');
                const warranty = String(r.custWarranty || '');
                const invStr = hasInv ? '含稅5%' : '免發票';

                const frontCells = [r.id||'', r.time||'', name, phone, source, seller, invStr];
                const backCells = [totalVal, discountVal, preTax, tax, itemCost, profit, commission40, deposit, balance, payStatus, addr, warranty, memo];

                const fullRow = [...frontCells, ...catCells, ...backCells];
                tsvContent += fullRow.join('\t') + '\n';
                htmlRows += `<tr>${fullRow.map(cell => `<td>${cell}</td>`).join('')}</tr>`;
            });

            currentTsvText = tsvContent;
            currentHtmlTable = `<table class="preview-table"><thead><tr>${allHeaders.map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>${htmlRows}</tbody></table>`;
            const previewBox = document.getElementById('tablePreviewContainer');
            if (previewBox) previewBox.innerHTML = currentHtmlTable;
            const modal = document.getElementById('csvPreviewModal');
            if (modal) modal.classList.remove('hidden');
        } catch(err) {
            alert('匯出失敗：' + err.message);
        }
    }

    function copyDualPlanQuoteText() {
        saveCurrentInputsToPlan();
        function buildSingleText(pKey) {
            const p = plansData[pKey];
            let subP = 0; let listStr = "";
            catOrder.forEach(cat => {
                (p.selections[cat] || []).forEach(sel => {
                    let target = (inv[cat] || [])[sel.idx];
                    if (target) {
                        let price = (sel.p !== undefined) ? sel.p : target.p;
                        if(!sel.isGift) subP += (price * (sel.qty||1));
                        listStr += `  • [${cat}] ${target.name}${sel.qty>1?` x${sel.qty}`:''}${sel.isGift?' (贈品)':''}\n`;
                    }
                });
            });
            const baseTotal = (p.manualTotal !== "" && !isNaN(parseFloat(p.manualTotal))) ? parseFloat(p.manualTotal) : (subP - (p.discount||0));
            const finalTotal = (p.noCard && p.noCard !== "") ? parseFloat(p.noCard) : baseTotal;
            return { listStr, finalTotal };
        }

        const resA = buildSingleText('A');
        const resB = buildSingleText('B');
        const diff = resB.finalTotal - resA.finalTotal;
        let diffStr = (diff > 0) ? `(方案 B 較高 +$${diff.toLocaleString()})` : (diff < 0 ? `(方案 B 較省 -$${Math.abs(diff).toLocaleString()})` : `(兩方案金額相同)`);

        let text = `🐚【神奇海螺電競 | 雙方案報價對比】\n日期：${new Date().toLocaleDateString()}\n==============================\n🔹【方案 A 內容】\n${resA.listStr || '  (未選擇項目)\n'}👉 方案 A 總計：$${resA.finalTotal.toLocaleString()}\n------------------------------\n🔸【方案 B 內容】\n${resB.listStr || '  (未選擇項目)\n'}👉 方案 B 總計：$${resB.finalTotal.toLocaleString()}\n==============================\n💡 兩方案價差：${diffStr}\n歡迎告訴我們您偏好哪一個方案，我們立即為您備貨與安排組裝！`;

        db.ref('records/' + id + '/notShipped').set(ns); 
    }

    function openTemplateModal() { const list = document.getElementById('templateList'); list.innerHTML = ''; Object.keys(templates).forEach(id => { const t = templates[id]; list.innerHTML += `<div class="p-2.5 border border-slate-200 rounded-xl mb-2 flex justify-between items-center bg-white" onclick="applyTemplate('${id}')"><div class="font-bold text-slate-800 text-xs">${t.name}</div><div class="flex gap-1.5"><button class="bg-blue-600 hover:bg-blue-700 text-white px-2.5 py-1 rounded-lg text-xs font-bold cursor-pointer" onclick="applyTemplate('${id}')">套用</button><button class="bg-slate-100 hover:bg-rose-100 text-slate-500 hover:text-rose-600 px-2.5 py-1 rounded-lg text-xs font-bold cursor-pointer" onclick="event.stopPropagation(); db.ref('templates/'+'${id}').remove()">刪除</button></div></div>`; }); document.getElementById('templateModal').classList.remove('hidden'); }
    function applyTemplate(id) { currentSelections = JSON.parse(JSON.stringify(templates[id].selections)); plansData[currentPlan].selections = currentSelections; document.getElementById('discountAmt').value = templates[id].discount || 0; document.getElementById('manualTotal').value = templates[id].manualTotal || ''; renderConfig(); document.getElementById('templateModal').classList.add('hidden'); }
    function saveTemplate() { const name = prompt("範本名稱："); if (!name) return; db.ref('templates/' + Date.now()).update({ name, selections: currentSelections, discount: document.getElementById('discountAmt').value, manualTotal: document.getElementById('manualTotal').value }); }
    function addCustomSeller() { const n = prompt("業務名稱："); if(n) { const s = document.getElementById('infoSeller'); const o = document.createElement('option'); o.value=n; o.text=n; o.selected=true; s.add(o); } }

    db.ref('inventory').on('value', s => { if(s.exists()) inv = s.val(); renderConfig(); if(!document.getElementById('tab-inventory').classList.contains('hidden')) renderInventoryEditor(); });
    db.ref('catOrder').on('value', s => { if(s.exists()) catOrder = s.val(); renderConfig(); });
    db.ref('records').on('value', s => { records = []; if(s.exists()) { const data = s.val(); for(let id in data) records.push(data[id]); } renderRecords(); if(!document.getElementById('tab-stats').classList.contains('hidden')) renderStats(); });
    db.ref('templates').on('value', s => { templates = s.exists() ? s.val() : {}; });

    window.onload = () => { showTab('calc'); toggleAdminMode(); toggleItemPriceMode(); toggleItemCostMode(); toggleSSTotalMode(); };
    </script>
</body>
</html>
