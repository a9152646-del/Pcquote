<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>神奇海螺電競 - 報價與庫存管理系統</title>
    <style>
        :root {
            --primary-color: #4a90e2;
            --secondary-color: #f5a623;
            --background-color: #f5f7fa;
            --card-background: #ffffff;
            --text-color: #333333;
            --border-color: #e1e4e8;
            --success-color: #2ea44f;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            padding-bottom: calc(20px + env(safe-area-inset-bottom));
            -webkit-font-smoothing: antialiased;
            -webkit-user-select: none;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-top: env(safe-area-inset-top);
        }

        .header h1 {
            margin: 0;
            font-size: 24px;
            color: #2c3e50;
        }

        .card {
            background: var(--card-background);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border: 1px solid var(--border-color);
        }

        h2 {
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 18px;
            color: #2c3e50;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 8px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 14px;
        }

        input[type="text"], input[type="number"], select {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
            background-color: #fff;
            -webkit-appearance: none;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(74,144,226,0.1);
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .grid-3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
        }

        /* 商品表格樣式 */
        .item-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 15px;
        }

        .item-table th, .item-table td {
            border: 1px solid var(--border-color);
            padding: 10px;
            text-align: left;
            font-size: 14px;
        }

        .item-table th {
            background-color: #f8f9fa;
            font-weight: 600;
        }

        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s;
            width: 100%;
            margin-bottom: 10px;
        }

        .btn:active {
            background-color: #357abd;
        }

        .btn-success { background-color: var(--success-color); }
        .btn-success:active { background-color: #24823d; }
        
        .btn-secondary { background-color: #6e7681; }
        .btn-secondary:active { background-color: #525962; }

        /* 結算明細與黃金利潤區塊 */
        .result-box {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            border: 1px solid var(--border-color);
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            font-size: 15px;
            border-bottom: 1px dashed #e1e4e8;
        }

        .result-row:last-child {
            border-bottom: none;
        }

        .result-row.total {
            border-top: 2px solid var(--border-color);
            padding-top: 12px;
            font-weight: bold;
            font-size: 18px;
            color: #d9534f;
        }

        .profit-card {
            background: #fff3cd;
            border: 1px solid #ffeeba;
            border-left: 6px solid #ffc107;
        }

        /* 截圖模式隱藏特定元素 */
        body.screenshot-mode .no-screenshot {
            display: none !important;
        }
        
        body.screenshot-mode .card {
            box-shadow: none;
            margin-bottom: 10px;
            padding: 15px;
        }

        .badge {
            background: #e1e4e8;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: normal;
        }
    </style>
</head>
<body>

<div class="container" id="mainContainer">
    <div class="header no-screenshot">
        <h1>神奇海螺電競系統</h1>
        <div style="display: flex; gap: 8px;">
            <button class="btn btn-secondary" style="width: auto; padding: 8px 12px; font-size: 14px;" onclick="toggleScreenshotMode()">切換截圖模式</button>
        </div>
    </div>

    <div class="card">
        <h2>基本資料設定</h2>
        <div class="grid-3">
            <div class="form-group">
                <label for="salesPerson">現場經手人</label>
                <select id="salesPerson">
                    <option value="江鈞宇">江鈞宇</option>
                    <option value="朱冠穎">朱冠穎</option>
                    <option value="江苙翔">江苙翔</option>
                </select>
            </div>
            <div class="form-group">
                <label for="customerName">客戶名稱</label>
                <input type="text" id="customerName" placeholder="請輸入客戶簡稱">
            </div>
            <div class="form-group">
                <label for="orderDate">單據日期</label>
                <input type="text" id="orderDate">
            </div>
        </div>
    </div>

    <div class="card">
        <h2>商品清單與報價庫存設定</h2>
        <div style="overflow-x: auto;">
            <table class="item-table" id="itemTable">
                <thead>
                    <tr>
                        <th style="width: 35%;">品項名稱 / 規格</th>
                        <th style="width: 15%;">數量</th>
                        <th style="width: 25%;">單件售價</th>
                        <th style="width: 25%;">單件成本</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td><input type="text" class="item-name" value="客製化電競主機方案" placeholder="輸入商品規格"></td>
                        <td><input type="number" class="item-qty" value="1" min="1" oninput="calculateEverything()"></td>
                        <td><input type="number" class="item-price" value="0" min="0" oninput="calculateEverything()"></td>
                        <td><input type="number" class="item-cost" value="0" min="0" oninput="calculateEverything()"></td>
                    </tr>
                </tbody>
            </table>
        </div>
        <button class="btn btn-secondary no-screenshot" style="padding: 6px; font-size: 14px;" onclick="addNewRow()">＋ 增加商品欄位</button>
    </div>

    <div class="card">
        <h2>付款金流方案</h2>
        <div class="form-group">
            <label for="payMethod">付款方式</label>
            <select id="payMethod" onchange="onPaymentMethodChange()">
                <option value="cash">現金結清 / 銀行轉帳</option>
                <option value="credit_card">信用卡刷卡 (一次付清)</option>
                <option value="no_card_install">無卡分期方案</option>
            </select>
        </div>

        <div id="creditCardBlock" style="display: none;">
            <div class="form-group">
                <label for="creditRate">信用卡手續費率 (%)</label>
                <input type="number" id="creditRate" value="2" step="0.1" oninput="calculateEverything()">
            </div>
        </div>

        <div id="noCardBlock" style="display: none;">
            <div class="grid-2">
                <div class="form-group">
                    <label for="installPeriods">分期總期數 (月)</label>
                    <input type="number" id="installPeriods" value="12" min="1" oninput="calculateEverything()">
                </div>
                <div class="form-group">
                    <label for="periodExtremity">每期衍生利息/外加金額</label>
                    <input type="number" id="periodExtremity" value="0" min="0" oninput="calculateEverything()">
                </div>
            </div>
        </div>
    </div>

    <div class="card">
        <h2>結算明細</h2>
        <div class="result-box">
            <div class="result-row">
                <span>原始商品銷售總額：</span>
                <span><span id="lblTotalSales">0</span> 元</span>
            </div>
            <div class="result-row" id="rowGoldFee">
                <span>金流平台手續費扣除：</span>
                <span>-<span id="lblGoldFee">0</span> 元</span>
            </div>
            <div class="result-row" id="rowInstallInterest" style="display: none;">
                <span>分期專案總外加利息：</span>
                <span>+<span id="lblInstallInterest">0</span> 元</span>
            </div>
            <div class="result-row total">
                <span>客戶應付/現場實收總額：</span>
                <span><span id="lblRealReceive">0</span> 元</span>
            </div>
        </div>
    </div>

    <div class="card profit-card">
        <h2>內部利潤與稅務結算 (底端)</h2>
        <div class="result-box" style="background: transparent; border: none; padding: 0;">
            <div class="result-row">
                <span><strong>稅前金額 (未含稅賺多少)：</strong></span>
                <span><strong id="lblPreTaxProfit" style="color: #2ea44f;">0</strong> 元</span>
            </div>
            <div class="result-row">
                <span><strong>內含稅金 (扣除 5% 營業稅)：</strong></span>
                <span>-<span id="lblTaxAmount" style="color: #d9534f;">0</span> 元</span>
            </div>
            <div class="result-row total" style="border-top: 2px solid #ffeeba; padding-top: 12px; margin-top: 5px;">
                <span><strong>稅後毛利：</strong></span>
                <span><strong id="lblPostTaxProfit" style="color: #0056b3; font-size: 20px;">0</strong> 元</span>
            </div>
        </div>
    </div>

    <div class="grid-2 no-screenshot">
        <button class="btn btn-success" onclick="exportToExcelFormat()">匯出銷貨 Excel 資料</button>
        <button class="btn btn-secondary" onclick="resetForm()">清空重新輸入</button>
    </div>
</div>

<script>
    // 自動初始化當天日期
    document.getElementById('orderDate').value = new Date().toISOString().slice(0,10).replace(/-/g, '/');

    // 動態增加商品欄位功能
    function addNewRow() {
        const tbody = document.getElementById('itemTable').getElementsByTagName('tbody')[0];
        const newRow = tbody.insertRow();
        newRow.innerHTML = `
            <td><input type="text" class="item-name" placeholder="輸入商品規格"></td>
            <td><input type="number" class="item-qty" value="1" min="1" oninput="calculateEverything()"></td>
            <td><input type="number" class="item-price" value="0" min="0" oninput="calculateEverything()"></td>
            <td><input type="number" class="item-cost" value="0" min="0" oninput="calculateEverything()"></td>
        `;
        calculateEverything();
    }

    // 當付款方式切換時的 UI 顯示切換
    function onPaymentMethodChange() {
        const method = document.getElementById('payMethod').value;
        
        document.getElementById('creditCardBlock').style.display = (method === 'credit_card') ? 'block' : 'none';
        document.getElementById('noCardBlock').style.display = (method === 'no_card_install') ? 'block' : 'none';
        document.getElementById('rowInstallInterest').style.display = (method === 'no_card_install') ? 'flex' : 'none';
        
        calculateEverything();
    }

    // 核心計算商務邏輯
    function calculateEverything() {
        let totalSales = 0;
        let totalCost = 0;

        // 走訪所有動態商品欄位加總
        const rows = document.getElementById('itemTable').getElementsByTagName('tbody')[0].rows;
        for (let i = 0; i < rows.length; i++) {
            const qty = parseFloat(rows[i].querySelector('.item-qty').value) || 0;
            const price = parseFloat(rows[i].querySelector('.item-price').value) || 0;
            const cost = parseFloat(rows[i].querySelector('.item-cost').value) || 0;

            totalSales += (qty * price);
            totalCost += (qty * cost);
        }

        const method = document.getElementById('payMethod').value;
        let goldFee = 0;
        let installInterest = 0;
        let realReceive = totalSales;

        // 金流方案個別計算
        if (method === 'credit_card') {
            const creditRate = parseFloat(document.getElementById('creditRate').value) || 0;
            goldFee = Math.round(totalSales * (creditRate / 100));
            realReceive = totalSales - goldFee;
            document.getElementById('rowGoldFee').style.display = 'flex';
        } else if (method === 'no_card_install') {
            const periods = parseInt(document.getElementById('installPeriods').value) || 0;
            const periodExtremity = parseFloat(document.getElementById('periodExtremity').value) || 0;
            
            // 利息加成
            installInterest = periods * periodExtremity;
            // 依您指示：無卡分期無流金抽成手續費，故手續費為 0
            goldFee = 0; 
            realReceive = totalSales + installInterest;
            
            // 隱藏手續費扣除列
            document.getElementById('rowGoldFee').style.display = 'none';
        } else {
            // 現金方案
            document.getElementById('rowGoldFee').style.display = 'flex';
            goldFee = 0;
            realReceive = totalSales;
        }

        // 渲染結算明細
        document.getElementById('lblTotalSales').innerText = totalSales.toLocaleString();
        document.getElementById('lblGoldFee').innerText = goldFee.toLocaleString();
        document.getElementById('lblInstallInterest').innerText = installInterest.toLocaleString();
        document.getElementById('lblRealReceive').innerText = realReceive.toLocaleString();

        // 根據指示更新底端利潤與稅務
        // 1. 稅前金額 (未含稅賺多少) = 原始商品銷售總額 - 商品總成本
        const preTaxProfit = totalSales - totalCost;

        // 2. 內含稅金 = 原始商品銷售總額 - (原始商品銷售總額 / 1.05) -> 四捨五入
        const taxAmount = Math.round(totalSales - (totalSales / 1.05));

        // 3. 稅後毛利 = 稅前金額 - 內含稅金
        const postTaxProfit = preTaxProfit - taxAmount;

        // 更新至底端顯示欄位
        document.getElementById('lblPreTaxProfit').innerText = preTaxProfit.toLocaleString();
        document.getElementById('lblTaxAmount').innerText = taxAmount.toLocaleString();
        document.getElementById('lblPostTaxProfit').innerText = postTaxProfit.toLocaleString();
    }

    // 切換截圖模式
    function toggleScreenshotMode() {
        document.body.classList.toggle('screenshot-mode');
    }

    // 匯出銷貨 Excel 資料範例
    function exportToExcelFormat() {
        alert("系統提示：已將今日銷貨資料封裝，準備與背景資料庫/Excel進行同盟同步。");
    }

    // 重設表單
    function resetForm() {
        if(confirm("確定要重設目前所有的報價與輸入欄位嗎？")) {
            location.reload();
        }
    }

    // 頁面加載時初次計算
    window.onload = function() {
        calculateEverything();
    };
</script>

</body>
</html>
